<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>html.ios *,html.ios *::before,html.ios *::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;mix-blend-mode:normal!important;will-change:auto!important}html.ios #nav{background:rgba(255,255,255,.96)!important}html.ios *,html.ios *::before,html.ios *::after{filter:none!important;text-shadow:none!important;animation-iteration-count:1!important}</style>

<title>PokéBooster</title>
<style>
:root{--bg:#0b0920;--ac:#f2c14e;--h:250}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;transition:.6s;background:radial-gradient(circle at 50% 40%,hsl(var(--h) 80% 36% / .6),transparent 62%),radial-gradient(circle at 90% 100%,hsl(calc(var(--h) + 60) 70% 30% / .35),transparent 55%)}
#app{min-height:100dvh;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 0 max(12px,env(safe-area-inset-bottom))}
img{-webkit-user-drag:none}
.top{display:flex;flex-direction:column;align-items:center;gap:4px}
.brand{height:40px;filter:drop-shadow(0 2px 8px #0008)}
h1{margin:8px 16px;font-size:22px;font-weight:800;text-align:center}
.sub{text-align:center;color:#cfcaf5;margin:-2px 16px 8px;font-weight:600}
.hint{color:#9a95c8;text-align:center;font-size:14px;padding:6px 16px}
.grow{flex:1}.center{flex:1;display:flex;align-items:center;justify-content:center}

/* Boosters */
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:34px calc(50% - 95px) 18px;scrollbar-width:none;flex:1;align-items:center;touch-action:pan-x}
.car::-webkit-scrollbar{display:none}
.pk{flex:none;width:190px;height:320px;position:relative;scroll-snap-align:center;transition:transform .3s,opacity .3s,filter .3s;transform:scale(.78);opacity:.5;filter:saturate(.6);touch-action:pan-x}
.pk.on{transform:scale(1.04);opacity:1;filter:none}
.strip,.body{position:absolute;left:0;right:0;background:linear-gradient(160deg,hsl(var(--ph) 75% 52%),hsl(calc(var(--ph) + 40) 80% 22%));background-size:100% 320px}
.strip{top:0;height:48px;border-radius:10px 10px 0 0;transform-origin:0 100%;z-index:3;box-shadow:inset 0 1px #fff6}
.body{top:48px;bottom:0;border-radius:0 0 10px 10px;background-position:0 -48px;overflow:hidden;box-shadow:0 22px 40px #0009;display:flex;flex-direction:column;align-items:center}
.pk.on .strip{transform:translate(calc(var(--t,0)*12px),calc(var(--t,0)*-80px)) rotate(calc(var(--t,0)*-18deg))}
.pk.on .body{transform:translateY(calc(var(--t,0)*10px))}
.pk.rel .strip,.pk.rel .body{transition:transform .3s}
.pk.torn .strip{opacity:0}
.pk.torn .body{animation:drop .85s .32s cubic-bezier(.5,0,.9,.5) forwards}
@keyframes blast{to{transform:scale(1.8);opacity:0;filter:brightness(3)}}
.cr{position:absolute;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,#fff5 0 2px,#0004 2px 4px),#fff2}
.strip .cr{top:0;border-radius:10px 10px 0 0}.body .cr{bottom:0}
.strip::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#fff5 50%,transparent 60%);animation:sheen 4s infinite}
.body::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;left:50%;top:48%;transform:translate(-50%,-50%);background:linear-gradient(#fff3 0 46%,#0003 46% 54%,#fff1 54%);opacity:.5}
.body::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,#fff5 50%,transparent 58%);animation:sheen 4s infinite .3s}
@keyframes sheen{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
.lg{position:relative;z-index:1;height:48px;margin-top:8px;display:flex;align-items:center}
.lg img{max-width:150px;max-height:48px;filter:drop-shadow(0 3px 6px #0009)}
.art{position:relative;z-index:1;width:112px;aspect-ratio:245/342;margin:6px 0 0 14px;border-radius:5px;background:#0003 center/cover;box-shadow:0 8px 18px #000a,0 0 0 1.5px #fff5;transform:rotate(5deg)}
.pn{position:absolute;z-index:1;bottom:22px;left:8px;right:8px;text-align:center;font-size:13px;text-shadow:0 2px 6px #000}
.swh{text-align:center;color:#e8e4ff;font-weight:700;padding:2px 16px 6px;animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.lnk{background:none;border:0;color:#cfcaf5;padding:14px;font-size:15px;font-weight:600}
.cta{margin:12px 24px 6px;padding:16px;border:0;border-radius:16px;font-weight:800;font-size:16px;color:#1a1200;background:linear-gradient(#ffe08a,#f2b630)}
.ovl{position:fixed;inset:0;background:#0b0920ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:7;font-weight:700}
.spin{width:36px;height:36px;border:4px solid #fff2;border-top-color:var(--ac);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}

/* Révélation par swipe */
.dots{display:flex;gap:7px;justify-content:center;padding:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:#fff3}
.dots i.d{background:#fff}.dots i.cur{transform:scale(1.6);background:var(--ac)}.dots i.last{outline:1.5px solid var(--ac);outline-offset:2px}
.tot{text-align:center;color:#cfcaf5;font-weight:600}.tot b{color:var(--ac);font-size:18px;margin-left:6px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:8px}
.stack{position:relative;width:min(290px,74vw);aspect-ratio:245/342;touch-action:none;margin-bottom:22px}
.sc{position:absolute;inset:0;border-radius:4.5% / 3.2%;overflow:hidden;background:#111;box-shadow:0 18px 40px #000a;transition:transform .3s}
.sc img{width:100%;height:100%;display:block;pointer-events:none}
.k0{animation:rise .3s}.k1{transform:scale(.94) translateY(14px);filter:brightness(.7)}.k2{transform:scale(.88) translateY(28px);filter:brightness(.5)}
@keyframes rise{from{transform:scale(.95)}}
.shine{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);background-size:320% 100%;background-position:var(--mx,0%) 0}
.holo .shine{opacity:1;animation:sweep 1.3s .25s}
@keyframes sweep{from{background-position:100% 0}to{background-position:0% 0}}
.info{text-align:center;min-height:96px}
.nm{font-size:19px;font-weight:800;margin-bottom:8px}
.bd{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:700;font-size:13px;color:var(--tc);border:1px solid var(--tc);background:color-mix(in srgb,var(--tc) 20%,transparent)}
.nw{display:inline-block;margin-left:6px;padding:4px 10px;border-radius:20px;font-weight:800;font-size:12px;background:#7ddc8a;color:#06210d}
.px{font-size:28px;font-weight:800;margin-top:8px}.px.hi{color:var(--ac);text-shadow:0 0 18px #f2c14e88}

/* Grilles */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 14px}
.g{position:relative;aspect-ratio:245/342;border-radius:6px;box-shadow:0 0 0 2px var(--tc);animation:in .45s both;animation-delay:calc(var(--i)*70ms)}
.g img{width:100%;height:100%;border-radius:5px;display:block}
.g.last{box-shadow:0 0 0 3px var(--tc),0 0 22px var(--tc)}
.g.miss{box-shadow:none;animation:none}.g.miss img{filter:grayscale(1) brightness(.28)}
.g.miss i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#fff8;font-size:15px}
.pr{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#0b0920;border:1px solid #fff4;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.star{position:absolute;left:4px;top:4px;background:#7ddc8a;color:#06210d;font-weight:800;font-size:10px;border-radius:8px;padding:1px 6px}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.9)}}
.badge{position:absolute;right:4px;top:4px;background:var(--ac);color:#1a1200;font-weight:800;font-size:12px;border-radius:10px;padding:2px 7px}
.big{text-align:center;font-size:40px;font-weight:800;color:var(--ac);margin:0;text-shadow:0 0 24px #f2c14e66}

/* Collection */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 14px}
.stc{background:#ffffff14;border-radius:14px;padding:14px}.stc b{display:block;font-size:22px}.stc span{color:#bdb8ea;font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 14px 8px;background:#ffffff10;border-radius:14px}
.row img{width:58px;height:32px;object-fit:contain;flex:none}
.row .t{flex:1;min-width:0}.row b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:#bdb8ea;font-weight:600}
.bar{height:6px;border-radius:3px;background:#fff2;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.chips{display:flex;gap:8px;padding:4px 14px 8px}
.chip{border:0;border-radius:20px;padding:9px 14px;background:#ffffff18;color:#d6d2f7;font-weight:700;font-size:14px}
.chip.on{background:var(--ac);color:#1a1200}
h2{margin:14px 16px 8px;font-size:16px}

/* Effets & zoom */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.p{position:absolute;left:50%;top:45%;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);animation:pop .95s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.flash{display:none}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.lb{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:8}
.pers{perspective:900px}
.tilt{position:relative;width:min(300px,76vw);aspect-ratio:245/342;border-radius:4.5% / 3.2%;overflow:hidden;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s;box-shadow:0 20px 50px #000}
.tilt img{width:100%;height:100%;display:block}
/* Menu du bas et finitions */
#app.nv{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
#app.fd>*:not(.swh){animation:fade .35s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
#nav{position:fixed;left:14px;right:14px;bottom:max(12px,env(safe-area-inset-bottom));height:66px;display:flex;gap:6px;padding:6px;border-radius:24px;background:rgba(23,20,58,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid #ffffff22;box-shadow:0 12px 32px #000b;z-index:6}
#nav button{flex:1;border:0;border-radius:18px;background:none;color:#9a95c8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;transition:.2s}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{background:linear-gradient(#ffe08a,#f2b630);color:#1a1200;box-shadow:0 4px 18px #f2c14e66}
.pk.on .body{box-shadow:0 26px 54px hsl(var(--ph) 85% 45% / .6)}
.ln{font-size:18px;font-weight:800;text-align:center;line-height:1.1;text-shadow:0 2px 8px #000a;padding:0 8px}
.art.noart{background-size:60%;background-repeat:no-repeat;background-position:center;background-color:#0004}
.art.nb{border-radius:50%;width:96px;height:96px;margin-left:20px;background:radial-gradient(circle,#fff 0 12%,#222 13% 20%,transparent 21%),linear-gradient(#e63946 0 46%,#222 46% 54%,#f4f4f4 54%);box-shadow:0 0 0 4px #222}
.row{border-left:4px solid hsl(var(--rh,45) 75% 55%)}
.row em{font-style:normal;font-weight:800;color:var(--ac)}
.row.best img{width:56px;height:auto;border-radius:4px}
.rb{display:flex;align-items:center;gap:10px;padding:5px 16px;font-size:14px;font-weight:700}
.rb span{width:96px;flex:none}.rb .bar{flex:1;margin:0}.rb b{width:34px;text-align:right}
.stc b{background:linear-gradient(#fff,#cfcaf5);-webkit-background-clip:text;background-clip:text;color:transparent}
/* v5 : boosters plus beaux, focus, brillance subtile */
.cr{height:18px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 1.5px,rgba(0,0,0,.38) 1.5px 3px),linear-gradient(#fff5,#0005)}
.strip{box-shadow:inset 0 1px #fff8,inset 10px 0 14px -6px #0005,inset -10px 0 14px -6px #0005}
.body{box-shadow:0 22px 40px #0009,inset 10px 0 14px -6px #0005,inset -10px 0 14px -6px #0005,inset 0 0 0 1px #fff2}
.pk.on .body{box-shadow:0 26px 54px hsl(var(--ph) 85% 45% / .6),inset 10px 0 14px -6px #0005,inset -10px 0 14px -6px #0005,inset 0 0 0 1px #fff3}
.glow{position:absolute;left:50%;top:42%;width:250px;height:250px;margin:-125px 0 0 -125px;background:radial-gradient(circle,hsl(calc(var(--ph) + 25) 100% 78% / .75),transparent 62%);animation:breathe 3s infinite alternate}
@keyframes breathe{to{opacity:.55;transform:scale(1.15)}}
.art{width:122px}
.art::after{content:"";position:absolute;inset:0;border-radius:5px;background:linear-gradient(120deg,#fff6,transparent 38%,transparent 62%,#fff3)}
.art.noart::after,.art.nb::after{display:none}
.lg img{max-width:158px;max-height:52px;filter:drop-shadow(0 0 8px #fff6) drop-shadow(0 3px 6px #000a)}
.sp{position:absolute;z-index:2;width:13px;height:13px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 2.4s infinite;opacity:0}
.s1{left:16%;top:36%}.s2{right:12%;top:50%;animation-delay:.8s}.s3{left:28%;top:74%;animation-delay:1.5s}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.seal{position:absolute;z-index:2;right:10px;bottom:36px;width:46px;height:46px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:17px;line-height:1;transform:rotate(8deg);background:radial-gradient(circle at 30% 28%,#fff7,transparent 60%),hsl(var(--ph) 70% 28%);border:2px solid #fffb;box-shadow:0 3px 8px #0008}
.seal small{font-size:8px;font-weight:700;margin-top:1px}
.fh{padding:4px 14px}.back{background:#ffffff18;border:0;color:#fff;border-radius:20px;padding:10px 16px;font-weight:700;font-size:15px}
.fpk{touch-action:none}
.pk.on.foc{transform:perspective(900px) rotateY(calc(var(--tx,0)*16deg)) scale(var(--fs,1.28));opacity:1;filter:none}
.sc.holo{box-shadow:0 0 30px color-mix(in srgb,var(--tc) 55%,transparent),0 18px 40px #000a}
.lgb{width:58px;height:32px;flex:none;display:flex;align-items:center;justify-content:center}
.lgb img{max-width:58px;max-height:32px;object-fit:contain}
.ph0{width:26px;height:26px;border-radius:50%;border:2px solid #222;background:linear-gradient(#e63946 0 44%,#222 44% 56%,#f4f4f4 56%);opacity:.85}
/* v6 : brillance subtile, profondeur, finitions */
.tilt{touch-action:none}
.zc{box-shadow:0 24px 60px #000,0 0 34px color-mix(in srgb,var(--tc) 45%,transparent)}
.zc .al,.zc .sh{position:absolute;inset:0;pointer-events:none}
.zc .al{background-size:100% 100%;transform:translate(calc(var(--px,0)*-7px),calc(var(--py,0)*-7px)) scale(1.05);transition:transform .12s}
.zc .sh{opacity:var(--gi,.5);background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.26) 48%,rgba(185,225,255,.16) 53%,transparent 66%);background-size:300% 100%;background-position:var(--mx,50%) 0}
.gl{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:var(--gi,.45);animation:glit 1.8s infinite alternate;
 background:radial-gradient(circle,#fff 0 1px,transparent 1.7px) 0 0/13px 13px,radial-gradient(circle,#ffeaa8 0 1px,transparent 1.7px) 6px 7px/17px 17px,radial-gradient(circle,#c7e6ff 0 .9px,transparent 1.5px) 3px 11px/11px 11px;
 -webkit-mask-image:radial-gradient(circle at var(--mx,50%) var(--my,50%),#000 0,transparent 46%);mask-image:radial-gradient(circle at var(--mx,50%) var(--my,50%),#000 0,transparent 46%)}
@keyframes glit{to{filter:brightness(1.7) contrast(1.2)}}
.zc .al{-webkit-mask-image:linear-gradient(#0000 5%,#000 15%,#000 50%,#0000 60%),linear-gradient(90deg,#0000 2%,#000 10%,#000 90%,#0000 98%);-webkit-mask-composite:source-in;mask-image:linear-gradient(#0000 5%,#000 15%,#000 50%,#0000 60%),linear-gradient(90deg,#0000 2%,#000 10%,#000 90%,#0000 98%);mask-composite:intersect}
.zc.fa .al{-webkit-mask-image:none;mask-image:none}
.zc .sh,.sc .shine{border-radius:inherit}
input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--ac);user-select:auto;-webkit-user-select:auto}
.row.st .chip{flex:none}.row.st small{display:block;margin-top:2px;white-space:normal}.row.st b{white-space:normal}
.sc .gl{opacity:.45}
.x{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:42px;height:42px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:18px}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.3;background:radial-gradient(circle,#fff 0 .6px,transparent 1px) 0 0/46px 46px,radial-gradient(circle,#fff8 0 .5px,transparent 1px) 23px 17px/61px 61px}
h1{background:linear-gradient(#fff,#cdc8f5);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:24px}
.cta{box-shadow:0 10px 26px #f2b63055,inset 0 1px #fff9;transition:transform .15s}.cta:active{transform:scale(.97)}
.pk.on::after{content:"";position:absolute;left:8%;right:8%;bottom:-20px;height:22px;background:radial-gradient(ellipse,hsl(var(--ph) 85% 55% / .55),transparent 70%);filter:blur(7px)}
.pk.on.foc{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{translate:0 -9px}}
.stc,.row{background:linear-gradient(145deg,#ffffff1c,#ffffff0a);border-top:1px solid #ffffff1a;border-right:1px solid #ffffff12;border-bottom:1px solid #ffffff12}
.stc{border-left:1px solid #ffffff1a}
.g img{box-shadow:0 6px 14px #0009}

/* v8 : tilt fluide, foil holographique, finitions */
.tilt{transition:none;will-change:transform;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.zc{box-shadow:var(--sx,0px) var(--sy,24px) 56px #000d,0 0 40px color-mix(in srgb,var(--tc) 40%,transparent),inset 0 0 0 1px #fff3}
.zc .hf,.zc .sh{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.zc .hf{mix-blend-mode:color-dodge;opacity:calc(var(--gi,.5)*.5);background:repeating-linear-gradient(115deg,#ff2d95 0,#ffb300 8%,#fff200 16%,#2dff9a 24%,#2dc8ff 32%,#8a5cff 40%,#ff2d95 48%);background-size:260% 260%;background-position:var(--mx,50%) var(--my,50%);filter:saturate(1.15);
 -webkit-mask-image:linear-gradient(#0000 5%,#000 16%,#000 50%,#0000 60%),linear-gradient(90deg,#0000 2%,#000 10%,#000 90%,#0000 98%);-webkit-mask-composite:source-in;mask-image:linear-gradient(#0000 5%,#000 16%,#000 50%,#0000 60%),linear-gradient(90deg,#0000 2%,#000 10%,#000 90%,#0000 98%);mask-composite:intersect}
.zc.fa .hf{-webkit-mask-image:radial-gradient(ellipse at var(--mx,50%) var(--my,50%),#000 0,#0006 70%,#0003);mask-image:radial-gradient(ellipse at var(--mx,50%) var(--my,50%),#000 0,#0006 70%,#0003)}
.zc .sh{opacity:1;mix-blend-mode:overlay;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.6),rgba(255,255,255,.12) 38%,transparent 62%)}
.zc .gl{opacity:calc(var(--gi,.5)*.55)}
.lb{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc) 28%,#0b0920),#000e 78%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:lbin .3s}
@keyframes lbin{from{opacity:0}}
.lb .pers{animation:zin .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes zin{from{transform:scale(.8) translateY(30px);opacity:0}}
body::before{background:radial-gradient(circle at 50% 30%,hsl(var(--h) 85% 38%/.65),transparent 60%),radial-gradient(circle at 10% 100%,hsl(calc(var(--h) + 70) 75% 30%/.4),transparent 55%),radial-gradient(circle at 100% 0,hsl(calc(var(--h) - 50) 70% 35%/.3),transparent 50%)}
#nav{height:68px;background:rgba(18,15,48,.78);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border:1px solid #ffffff26;box-shadow:0 14px 36px #000c,inset 0 1px #ffffff22}

/* v14 : boosters foil réalistes, filtre d'époques */

 linear-gradient(100deg,transparent 0 16%,rgba(255,255,255,.34) 22%,transparent 30% 60%,rgba(255,255,255,.2) 68%,transparent 76%),
 linear-gradient(168deg,hsl(var(--ph) 92% 68%) 0%,hsl(var(--ph) 94% 42%) 28%,hsl(calc(var(--ph) + 28) 92% 60%) 48%,hsl(calc(var(--ph) + 8) 94% 30%) 74%,hsl(calc(var(--ph) - 12) 92% 18%) 100%)}

// ---------- Découpe libre : géométrie ----------
function cutPolys(pts){
  const rs=(a,step)=>{const o=[a[0]];let acc=0,pr=a[0];
    for(let i=1;i<a.length;i++){const x=a[i][0],y=a[i][1];let dx=x-pr[0],dy=y-pr[1],d=Math.hypot(dx,dy);
      while(d>0&&acc+d>=step){const t=(step-acc)/d,nx=pr[0]+dx*t,ny=pr[1]+dy*t;o.push([nx,ny]);pr=[nx,ny];dx=x-pr[0];dy=y-pr[1];d=Math.hypot(dx,dy);acc=0}
      acc+=d;pr=[x,y]}
    o.push(a[a.length-1]);return o};
  let a=rs(pts,5);
  a=a.map((q,i)=>(i===0||i===a.length-1)?q:[(a[i-1][0]+q[0]*2+a[i+1][0])/4,(a[i-1][1]+q[1]*2+a[i+1][1])/4]);
  const n=a.length,dir=(p,q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]};
  const d0=dir(a[Math.min(3,n-1)],a[0]),d1=dir(a[Math.max(0,n-4)],a[n-1]);
  const S=[a[0][0]+d0[0]*500,a[0][1]+d0[1]*500],E=[a[n-1][0]+d1[0]*500,a[n-1][1]+d1[1]*500];
  const cd=dir(S,E),nA=[-cd[1],cd[0]],nB=[cd[1],-cd[0]],L=1500;
  const jit=()=>a.map((q,i)=>{const t=(i>0&&i<n-1)?(Math.random()*2-1)*1.6:0;return[q[0]+nA[0]*t,q[1]+nA[1]*t]});
  const mk=nn=>[S,...jit(),E,[E[0]+nn[0]*L,E[1]+nn[1]*L],[S[0]+nn[0]*L,S[1]+nn[1]*L]];
  return{A:mk(nA),B:mk(nB),nA,nB,mid:a[Math.floor(n/2)],path:a}
}

function bindSwipe(){
  const stk=document.getElementById('stk'),top=document.getElementById('top'),k1=stk.querySelector('.k1');
  let sx,sy,dx=0,dy=0,on=false,t0=0;
  stk.onpointerdown=e=>{on=true;sx=e.clientX;sy=e.clientY;dx=dy=0;t0=Date.now();stk.setPointerCapture(e.pointerId);top.style.transition='none';top.style.animation='none'};
  stk.onpointermove=e=>{
    if(!on) return; dx=e.clientX-sx;dy=e.clientY-sy;
    top.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/16}deg)`;
    top.style.setProperty('--px',Math.max(-1,Math.min(1,dx/120)));top.style.setProperty('--py',Math.max(-1,Math.min(1,dy/120)));top.style.setProperty('--mx',50+dx/3+'%');top.style.setProperty('--my',50+dy/3+'%');
    const p=Math.min(1,Math.hypot(dx,dy)/150); if(k1)k1.style.transform=`scale(${.94+.06*p}) translateY(${14-14*p}px)`;
  };
  const end=()=>{
    if(!on) return; on=false;
    const d=Math.hypot(dx,dy),v=d/(Date.now()-t0+1);
    const tap=d<8&&Date.now()-t0<300;if(tap){dx=140;dy=-20}
    if(tap||d>110||(d>50&&v>.5)){
      sfx.swish();top.style.transition='transform .35s ease-in,opacity .35s';
      top.style.transform=`translate(${dx*5}px,${dy*5}px) rotate(${dx/5}deg)`;top.style.opacity=0;
      setTimeout(()=>{ if(++idx>=pack.length) go('results'); else reveal() },300);
    } else {top.style.transition='transform .3s';top.style.transform='';if(k1)k1.style.transform=''}
  };
  stk.onpointerup=end; stk.onpointercancel=end;
}

   if(stats.last!==td){stats.streak=stats.last===d(1)?(stats.streak||0)+1:1;stats.last=td;stats.bst=Math.max(stats.bst||0,stats.streak)}
   (stats.sp=stats.sp||{})[id]=(stats.sp[id]||0)+n;stats.gods=(stats.gods||0)+gods;stats.gn=(stats.gn||0)+gods}

      ${ready?`<div class="tqty">${bl.map(n=>`<button class="chip" data-n="${n}" ${tyc.money<price*n-1e-9?'disabled':''}><b>×${nf(n)}</b><small>${n===1?'en direct · ':''}${fm(price*n)}</small></button>`).join('')}<button class="chip" data-n="${maxA}" ${maxA<1?'disabled':''}><b>Max</b><small>${nf(Math.min(maxA,bl[bl.length-1]))}</small></button></div>`:'<div class="center" style="padding:24px"><div class="spin"></div></div>'}

      ${tyc.money<Math.max(price||1,2)&&!tyc.lv.emp?`<button class="cta" id="tres">Petit boulot : +${fmt(Math.max(5,Math.round((packPrice(tyc.set)||0)*1.5)))}</button>`:''}`;
    }
  }else if(ttab==='up'){

function sharpen(d,w,h){const s=new Uint8ClampedArray(d.data),o=d.data,k=[0,-.4,0,-.4,2.6,-.4,0,-.4,0];

async function enhance(im){const f=Math.max(2,Math.ceil(1100/im.naturalHeight)),w=im.naturalWidth*f,h=im.naturalHeight*f,c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(im,0,0,w,h);
 const d=x.getImageData(0,0,w,h);sharpen(d,w,h);x.putImageData(d,0,0);
 return new Promise((ok,ko)=>c.toBlob(b=>b?ok(URL.createObjectURL(b)):ko(),'image/webp',.93))}
function best(u,min){const k=u+'|'+min;if(cache.has(k))return cache.get(k);
 const p=(async()=>{let cur;try{cur=await load(u)}catch(e){return u}
  if(cur.naturalWidth>=min)return u;
  for(const a of alts(u)){try{const i=await load(a);if(i.naturalWidth>cur.naturalWidth*1.1)return a}catch(e){}}
  if(cur.naturalWidth>=MIN)return u;
  try{return await enhance(await load(u,true))}catch(e){return u}})();
 cache.set(k,p);return p}
function fix(el){if(el.tagName!=='IMG')return;const u=el.currentSrc||el.src;if(!RX.test(u))return;
 const min=el.closest&&el.closest('.zc')?760:MIN;
 best(u,min).then(n=>{if(n!==u&&el.isConnected&&(el.currentSrc||el.src)===u){el.dataset.hd=1;el.src=n}})}
new MutationObserver(ms=>{for(const m of ms){if(m.type==='attributes')fix(m.target);else m.addedNodes.forEach(n=>{if(n.nodeType===1){fix(n);n.querySelectorAll&&n.querySelectorAll('img').forEach(fix)}})}})
 .observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});
})();
